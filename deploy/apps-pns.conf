# KARAM OEE portal at https://apps.karam.in/pns/
location = /pns {
    return 301 /pns/;
}

# Never expose application configuration or private source directories.
location = /pns/config.php { deny all; return 403; }
location = /pns/config.example.php { deny all; return 403; }
location = /pns/setup.php { deny all; return 403; }
location ^~ /pns/.git/ { deny all; return 403; }
location ^~ /pns/includes/ { deny all; return 403; }
location ^~ /pns/migrations/ { deny all; return 403; }
location ^~ /pns/tests/ { deny all; return 403; }

# Static files and the PHP front controller. The nested PHP location keeps
# SCRIPT_FILENAME explicit because this site is mounted below the domain root.
location ^~ /pns/ {
    alias /www/wwwroot/apps.karam.in/pns/;
    index index.php index.html;

    location ~ ^/pns/(.+\.php)(/.*)?$ {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/apps.karam.in/pns/$1;
        fastcgi_param SCRIPT_NAME /pns/$1;
        fastcgi_param PATH_INFO $2;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors on;
    }

    try_files $uri $uri/ /pns/index.php?$query_string;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
